name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mcp/requirements.txt
            mcp/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=60

  test-flybrain-braincluster-gates:
    name: FlyBrain brain-cluster merge gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mcp/requirements.txt
            mcp/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest pytest-timeout

      - name: Run brain-cluster contract tests
        run: |
          pytest tests/test_flybrain_brain_cluster.py \
                 tests/test_flybrain_brain_cluster_training.py \
                 tests/test_flybrain_brain_cluster_pipeline.py \
                 tests/test_flybrain_brain_cluster_fw_samples.py \
                 tests/test_flybrain_brain_cluster_release_prep.py \
                 tests/test_flybrain_brain_cluster_thresholds.py \
                 -v --tb=short --timeout=60

  test-a2a:
    name: A2A server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: a2a_server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            a2a_server/requirements.txt
            a2a_server/requirements-dev.txt
            a2a_server/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e "."
          pip install -r requirements-dev.txt
          pip install httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=30

  test-scripts:
    name: Sync script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          # a2a_context_bridge sys.exit()s at import without aiohttp, which aborts
          # collection for the whole directory rather than failing one test.
          pip install aiohttp

      - name: Run tests
        run: pytest tests/ hooks/tests/ -v --tb=short --timeout=30

  test-mlops:
    name: MLOps tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          # mlops/embedding and mlops/finetune import these at module scope,
          # so collection fails without them.
          # Kept in step with the code by mlops/tests/test_ci_installs_what_mlops_imports.py:
          # a module-scope import of something missing here fails COLLECTION, which
          # pytest reports as "N errors", not as a missing dependency.
          # scikit-learn and joblib were arriving transitively via sentence-transformers
          # and are named now because they are imported at module scope.
          pip install numpy scikit-learn joblib transformers datasets sentence-transformers

      - name: Run tests
        # 120s, not the 30s used elsewhere: the first import of
        # sentence_transformers/torch on a cold runner takes over a minute and
        # trips a shorter per-test timeout as ~18 spurious errors.
        run: pytest mlops -v --tb=short --timeout=120

  test-callgraph:
    name: Callgraph tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The regression tests build the graph at historical revisions
          # (69adfa4^, c1c40a9~1, 08c9198^) to prove the tool still catches the
          # bugs it was validated against. A shallow clone makes git rev-parse
          # exit 128 on those.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout

      - name: Run tests
        # The tool is stdlib-only by design, so there is nothing else to install.
        # PYTHONPATH points at scripts/ so `callgraph` is importable as a package.
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: pytest scripts/callgraph/tests -v --tb=short --timeout=120

  test-eval:
    name: Eval tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          # numpy/joblib/sklearn are imported INSIDE functions in
          # grounding_gate_oos_eval and grounding_gate_qf_eval, so a scan of
          # module-level imports alone misses them and the job fails at runtime.
          pip install numpy joblib scikit-learn

      - name: Run tests
        run: pytest eval -v --tb=short --timeout=30

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # check_test_weakening.py walks the PR's commits one at a time.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # The 2026-09 audit found 180 tests that stayed green with the behaviour they
      # name removed. This rejects the mechanical shapes (bare raises(Exception),
      # 'or True', swallowed asserts, assertion-free tests, non-strict xfail, skips
      # gated on undocumented env vars). Known debt is in the allowlist, which only
      # shrinks: a stale entry (the test was fixed) fails too, so the fix and the
      # entry's deletion land together. See AGENTS.md "Test-writing rules for agents".
      - name: Test honesty
        run: python3 scripts/check_test_honesty.py --fail-stale

      # Heuristic, so it warns rather than fails: a commit that changes source and,
      # in the same commit, drops assertions / loosens == to >= / adds skips in a
      # test file, without a 'Test-weakened-because:' trailer.
      - name: Flag tests weakened alongside source changes
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_test_weakening.py
          --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Check syntax and imports
        run: |
          ruff check mcp/server.py mcp/memcheck/ \
                     a2a_server/server.py \
                     scripts/ \
                     --target-version py311 \
                     --select E9,F401,F811,F821,F841 \
                     --ignore E402

      # A live Qdrant key shipped for two months as an os.environ.get() default
      # (#79). Anything key-shaped in that position is a secret, not a default.
      - name: Reject secret-shaped env defaults
        run: |
          if git grep -nIE 'os\.(environ\.get|getenv)\([^)]*"[0-9a-fA-F]{32,}"' -- '*.py'; then
            echo "::error::hardcoded secret as an environment-variable default"
            exit 1
          fi

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp/requirements.txt

      - name: Install mypy and stubs
        run: |
          pip install mypy
          pip install -r mcp/requirements.txt || true

      - name: Run mypy on mcp/server.py
        working-directory: mcp
        run: |
          mypy server.py \
            --config-file ../mypy.ini \
            --no-error-summary \
            || true

      - name: Run mypy on scripts
        run: |
          mypy scripts/ \
            --config-file mypy.ini \
            --no-error-summary \
            || true

      - name: Run mypy on a2a_server
        working-directory: a2a_server
        run: |
          pip install -r requirements.txt || true
          mypy server.py \
            --config-file ../mypy.ini \
            --no-error-summary \
            || true

  schema-consistency:
    name: Schema consistency test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mnemosyne-memory has no dependencies. Without it the checks against its real
      # DDL (TestEmbeddedSchemaMatchesMnemosyne, the "mnemosyne" subtests) skip and
      # the file only compares the scripts with its own embedded copy of the schema.
      # Pinned to the version the service runs; bump both together.
      - name: Install pytest and mnemosyne
        run: pip install pytest mnemosyne-memory==3.4.0

      - name: Run schema consistency tests
        run: pytest tests/test_schema_consistency.py -v --tb=short

  test-mcp-integration:
    name: MCP tool integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mcp/requirements.txt
            mcp/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run MCP integration tests
        run: pytest tests/test_mcp_integration.py -v --tb=short --timeout=60

  dead-code:
    name: Dead code (vulture)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vulture
        run: pip install vulture

      # --min-confidence 60 is vulture's default and the only setting at which it
      # reports unused functions at all; at 80 this job could only ever see unused
      # variables, which is not what a dead-code gate is for. The exclusions are
      # trees whose contents are unreferenced by design: callgraph/fixtures are
      # synthetic corpora its tests assert against, and callgraph/docs/legacy is a
      # kept-for-reference artefact. Tests stay in scope -- they are where a
      # registered entry point is referenced, so dropping them invents dead code.
      #
      # No `|| true`. This step previously could not fail, which made its green
      # indistinguishable from a clean run.
      - name: Run vulture
        run: |
          vulture mcp/server.py \
                  mcp/memcheck/ \
                  scripts/ \
                  a2a_server/server.py \
                  .vulture_whitelist.py \
                  --min-confidence 60 \
                  --exclude '*/callgraph/fixtures/*,*/callgraph/docs/legacy/*'

      - name: Check for stale whitelist entries
        run: python3 scripts/check_vulture_whitelist.py
