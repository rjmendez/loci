name: "Nightly Policy Evolution (DRPG Loop)"

on:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC nightly
  workflow_dispatch:
    inputs:
      policy_id:
        description: 'Specific policy_id to evolve (leave blank for all)'
        required: false

jobs:
  evolve-policies:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r mcp/requirements.txt || pip install pytest python-dotenv

      - name: Run DRPG policy evolution
        env:
          LOCI_TRAJECTORY_DIR: ${{ vars.LOCI_TRAJECTORY_DIR || '/tmp/loci/trajectories' }}
          LOCI_POLICY_DIR: ${{ vars.LOCI_POLICY_DIR || '/tmp/loci/policies' }}
        run: |
          python - <<'PYEOF'
          import sys, json
          sys.path.insert(0, 'mcp')
          try:
              from drpg_evolution import TrajectoryStore, evolve_policy
              from policy import PolicyBackend
              from pathlib import Path
              import os

              policy_dir = Path(os.environ.get("LOCI_POLICY_DIR", "/tmp/loci/policies"))
              traj_dir = Path(os.environ.get("LOCI_TRAJECTORY_DIR", "/tmp/loci/trajectories"))
              target_id = "${{ inputs.policy_id }}"

              backend = PolicyBackend(policy_dir)
              store = TrajectoryStore(traj_dir)

              policy_ids = [target_id] if target_id else store.list_policies()
              print(f"Evolving {len(policy_ids)} policies...")
              
              results = []
              for pid in policy_ids:
                  try:
                      result = evolve_policy(pid, backend, store)
                      results.append(result)
                      print(f"  {pid}: action={result.get('action')} score={result.get('score', 0):.3f} steps={result.get('steps_analyzed', 0)}")
                  except Exception as e:
                      print(f"  {pid}: ERROR {e}")
              
              promoted = sum(1 for r in results if r.get('action') == 'promote')
              demoted = sum(1 for r in results if r.get('action') == 'demote')
              print(f"\nSummary: {len(results)} evolved, {promoted} promoted, {demoted} demoted")
          except ImportError as e:
              print(f"drpg_evolution not available on this branch: {e}")
              sys.exit(0)
          PYEOF
