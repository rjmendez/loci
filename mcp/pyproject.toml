[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loci-mcp"
version = "0.2.0"
description = "Loci — persistent memory and knowledge MCP server for AI agent meshes"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.17.0,<1.19.0",
    "fastembed>=0.7.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "iocextract>=1.16.1",
    "ladybug>=0.18.0",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=1.10",
]

[project.optional-dependencies]
# mnemosyne is an optional substrate for shared memory across sessions.
# Install from PyPI ("mnemosyne-memory") or build from source.
# Omit for Qdrant-only operation — all MCP tools degrade gracefully without it.
mnemosyne = [
    "mnemosyne-memory[mcp]",
]
# pyarrow reads the FlyWire .feather snapshots in flybrain_brain_cluster_fw_samples
# (the braincluster-build-fw-samples entry point) and converts them with
# Table.to_pandas(), which needs pandas. Both are imported lazily there,
# so the MCP server runs without them, but that module's tests build feather
# fixtures: without pyarrow they fail collection (aborting the whole pytest
# run), and without pandas every sample build raises.
flybrain = [
    "pyarrow>=14",
    "pandas>=2",
]
test = [
    "hypothesis>=6.0",
    "pyarrow>=14",
    "pandas>=2",
]

[project.scripts]
loci-mcp = "server:main"
braincluster-goldenset-gate-runner = "flybrain_brain_cluster_training:main"
braincluster-p0-dry-run = "flybrain_brain_cluster_pipeline:main"
braincluster-threshold-calibrate = "flybrain_brain_cluster_thresholds:main"
braincluster-build-fw-samples = "flybrain_brain_cluster_fw_samples:main"
braincluster-build-banc-samples = "flybrain_brain_cluster_banc_samples:main"
braincluster-build-mc-samples = "flybrain_brain_cluster_mc_samples:main"
braincluster-build-mv-samples = "flybrain_brain_cluster_mv_samples:main"
braincluster-build-ol-samples = "flybrain_brain_cluster_ol_samples:main"
braincluster-release-prep = "flybrain_brain_cluster_release_prep:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memcheck*", "graph*"]

# server.py's import chain (direct + lazy sibling imports) pulls in every
# top-level module below; packages.find only covers memcheck/graph.
[tool.setuptools]
py-modules = [
    "backends",
    "batched_gen",
    "embed_ops",
    "graph_tools",
    "flybrain_harness_storage",
    "flybrain_brain_cluster",
    "flybrain_brain_cluster_training",
    "flybrain_brain_cluster_pipeline",
    "flybrain_brain_cluster_thresholds",
    "flybrain_brain_cluster_fw_samples",
    "flybrain_brain_cluster_release_prep",
    "flybrain_hb_adapter",
    "flybrain_fw_metadata_adapter",
    "flybrain_scope_engine",
    "flybrain_dataset_registry",
    "flybrain_brain_cluster_samples",
    "flybrain_banc_adapter",
    "flybrain_brain_cluster_banc_samples",
    "flybrain_l1em_adapter",
    "flybrain_brain_cluster_l1em_samples",
    "flybrain_mc_adapter",
    "flybrain_brain_cluster_mc_samples",
    "flybrain_mv_adapter",
    "flybrain_brain_cluster_mv_samples",
    "flybrain_ol_adapter",
    "flybrain_brain_cluster_ol_samples",
    "flybrain_brain_cluster_baselines",
    "flybrain_hash_stamps",
    "replay_fingerprint",
    "grounding",
    "inv_store",
    "investigation_tools",
    "ladybug_ops",
    "legacy_env",
    "llm_local",
    "llm_tools",
    "mnemo_ops",
    "model_json",
    "openrouter",
    "qdrant_ops",
    "query_expand",
    "reranker",
    "retrieval_eval",
    "server",
    "text_ops",
    "verdict_ops",
    "verify",
    "wiring_obligation_scan",
]
