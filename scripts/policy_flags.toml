# Registry of default-off LEARNED features (Tripwire-Governor S15). Checked in CI by
# scripts/check_policy_flags.py: every entry needs a reason and a review_by date, and CI fails once
# review_by is in the past. Add an entry in the same change that ships a learned feature OFF:
#
# [[flag]]
# name = "learned_router"
# reason = "why it is off, and what evidence would turn it on"
# review_by = 2026-11-17
#

[[flag]]
name = "learned_genes"
reason = "S18 bounded evolver: learned gene scales in Policy.config are ignored until the owner removes this entry (needs C11 trajectory rows, S16/S17 passed and a Stage-0 pass); LOCI_LEARNED_GENES=1 alone cannot turn it on"
review_by = 2026-11-17
