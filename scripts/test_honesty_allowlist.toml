# Allowlist for scripts/check_test_honesty.py -- see AGENTS.md "Test-writing rules for agents".
#
# Every entry is a known violation that CI tolerates for now, with the reason it is
# tolerated. The initial [[allow]] list is the pre-existing debt the 2026-09 test audit
# found at 3a1ad78; it is meant to SHRINK. When you fix a test, delete its entry in the
# same commit (the checker reports entries that no longer match as stale). Do not add
# an entry to get a new test past CI: fix the test. A new entry needs a reason a
# reviewer can check, not "pre-existing".
#
# Entries are keyed by (file, test, rule); `test` is the function's qualified name
# (Class::method) or "<module>" for module-level code. Regenerate the list, keeping
# existing reasons, with:  python3 scripts/check_test_honesty.py --write-allowlist

# Environment variables that may gate a skip. Each is a deliberate live-smoke opt-in
# and must also be named in AGENTS.md (the checker verifies that). A test gated on
# anything else never runs in CI, so it counts as no test.
[live_smoke_opt_ins]
LOCI_TESTS_LIVE = "testsupport/loci_hermetic.py: disables isolation for a deliberate live smoke run against the real stores"

# Helper functions defined outside the test file that perform assertions, so calling
# one counts as asserting (helpers in the same file or a sibling module in the test's
# own directory are resolved automatically).
[helpers]
names = []


